# ADenum — docker-compose.yml
# FIX #12: Removed deprecated 'version' key (not needed in Compose V2+)
#
# Services:
#   neo4j   — graph database (browser at http://localhost:7474)
#   api     — ADenum FastAPI + graph explorer (http://localhost:8080)
#
# Usage:
#   docker-compose up -d neo4j          # Neo4j only (run Python locally)
#   docker-compose up -d --build        # Full stack

services:
  neo4j:
    image: neo4j:5-community
    container_name: adenum-neo4j
    ports:
      - "7474:7474"   # Neo4j browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/adenum123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  api:
    build: .
    container_name: adenum-api
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=adenum123
      - ADENUM_API_PORT=8080
    volumes:
      - ./collected:/app/collected
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
