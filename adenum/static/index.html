<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADenum — AD Attack Path Explorer</title>
  <meta name="description" content="ADenum Active Directory Attack Path Analytics — Interactive graph explorer for AD attack paths, Kerberoastable accounts, delegation misconfigs, and dangerous ACLs." />

  <!-- vis-network CDN -->
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>

  <style>
    /* ===== Google Font ===== */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    /* ===== Design tokens ===== */
    :root {
      --bg-base:      #0d1117;
      --bg-surface:   #161b22;
      --bg-card:      #21262d;
      --bg-hover:     #30363d;
      --border:       #30363d;
      --border-focus: #388bfd;
      --text-primary: #e6edf3;
      --text-muted:   #8b949e;
      --text-code:    #79c0ff;
      --accent-blue:  #388bfd;
      --accent-purple:#a371f7;
      --accent-green: #3fb950;
      --accent-orange:#e3b341;
      --accent-red:   #f85149;
      --accent-cyan:  #39d353;
      --radius:       8px;
      --radius-lg:    12px;
      --shadow:       0 4px 24px rgba(0,0,0,.45);
      --font:         'Inter', system-ui, sans-serif;
      --mono:         'JetBrains Mono', monospace;
    }

    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      display: grid;
      grid-template-rows: 56px 1fr;
      grid-template-columns: 320px 1fr;
      grid-template-areas:
        "header  header"
        "sidebar graph";
      overflow: hidden;
    }

    /* ===== Top bar ===== */
    header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
      letter-spacing: -.3px;
      flex-shrink: 0;
    }

    .logo svg {
      width: 28px; height: 28px;
      fill: var(--accent-purple);
      filter: drop-shadow(0 0 6px #a371f780);
    }

    .logo span { color: var(--accent-purple); }

    .search-wrap {
      flex: 1;
      max-width: 480px;
      position: relative;
    }

    #node-search {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px 8px 38px;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    #node-search:focus { border-color: var(--border-focus); }
    #node-search::placeholder { color: var(--text-muted); }

    .search-icon {
      position: absolute;
      left: 11px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: .85rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: var(--accent-blue);
      color: #fff;
    }
    .btn-primary:hover { background: #1f6feb; }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text-primary);
    }
    .btn-outline:hover { background: var(--bg-hover); }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
      flex-shrink: 0;
    }
    .status-dot.error { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }
    .status-dot.loading { background: var(--accent-orange); animation: pulse 1s infinite; }

    @keyframes pulse {
      0%,100% { opacity:1; } 50% { opacity:.4; }
    }

    /* ===== Sidebar ===== */
    #sidebar {
      grid-area: sidebar;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      font-size: .8rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      font-family: var(--font);
    }
    .tab-btn.active {
      color: var(--text-primary);
      border-bottom-color: var(--accent-blue);
    }
    .tab-btn:hover:not(.active) { color: var(--text-primary); background: var(--bg-hover); }

    .tab-content { display: none; flex-direction: column; overflow: hidden; flex: 1; }
    .tab-content.active { display: flex; }

    /* Findings tab */
    .findings-list {
      overflow-y: auto;
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .finding-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .finding-card:hover { border-color: var(--accent-blue); background: var(--bg-hover); }

    .finding-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .finding-name {
      font-size: .85rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .badge {
      font-size: .7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      font-family: var(--mono);
    }
    .badge-red    { background: #f8514920; color: var(--accent-red);    border: 1px solid #f8514940; }
    .badge-orange { background: #e3b34120; color: var(--accent-orange); border: 1px solid #e3b34140; }
    .badge-blue   { background: #388bfd20; color: var(--accent-blue);   border: 1px solid #388bfd40; }
    .badge-green  { background: #3fb95020; color: var(--accent-green);  border: 1px solid #3fb95040; }

    .finding-desc { font-size: .78rem; color: var(--text-muted); line-height: 1.4; }

    /* Path tab */
    .path-form { padding: 14px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .path-form label { font-size: .8rem; color: var(--text-muted); margin-bottom: 2px; display: block; }
    .path-form input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: .85rem;
      outline: none;
    }
    .path-form input:focus { border-color: var(--border-focus); }

    .path-results {
      flex: 1;
      overflow-y: auto;
      padding: 0 14px 14px;
    }

    .path-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: .8rem;
    }
    .path-hops { font-size: .72rem; color: var(--text-muted); margin-bottom: 4px; }
    .path-nodes { color: var(--text-code); font-family: var(--mono); line-height: 1.5; word-break: break-all; }
    .path-rels { font-size: .72rem; color: var(--accent-orange); margin-top: 4px; }

    /* Info tab (node detail) */
    .node-detail { padding: 14px; font-size: .85rem; overflow-y: auto; flex: 1; }
    .node-detail h3 { font-size: 1rem; margin-bottom: 10px; color: var(--text-primary); }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .detail-key   { color: var(--text-muted); font-size: .8rem; }
    .detail-value { color: var(--text-code);  font-family: var(--mono); font-size: .8rem; max-width: 180px; text-align: right; word-break: break-all; }

    .pill-true  { color: var(--accent-red);   font-weight: 600; }
    .pill-false { color: var(--text-muted); }

    /* ===== Graph area ===== */
    #graph-area {
      grid-area: graph;
      position: relative;
      background: var(--bg-base);
      overflow: hidden;
    }

    #network-canvas {
      width: 100%;
      height: 100%;
    }

    /* Loading overlay */
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      z-index: 5;
      gap: 16px;
      transition: opacity .3s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-purple);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: var(--text-muted);
      font-size: .9rem;
    }

    /* Stats bar at bottom of graph */
    #stats-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 6px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: .8rem;
      color: var(--text-muted);
      box-shadow: var(--shadow);
    }

    .stat-item { display: flex; align-items: center; gap: 6px; }
    .stat-dot  { width: 8px; height: 8px; border-radius: 50%; }

    /* Tooltip overlay for selected node */
    #node-tooltip {
      position: absolute;
      pointer-events: none;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: .8rem;
      box-shadow: var(--shadow);
      max-width: 240px;
      display: none;
      z-index: 20;
    }

    /* Legend */
    .legend {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      font-size: .78rem;
      box-shadow: var(--shadow);
    }
    .legend-title { font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
    .legend-row   { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: var(--text-muted); }
    .legend-dot   { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: .85rem;
    }
    .empty-state svg { margin-bottom: 10px; opacity: .4; }

    /* Toast notifications */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: .85rem;
      box-shadow: var(--shadow);
      z-index: 100;
      display: none;
      max-width: 320px;
    }
    #toast.show { display: block; animation: slideIn .2s ease; }
    @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body>

<!-- ===== Top bar ===== -->
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
    </svg>
    AD<span>enum</span>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="node-search" type="text" placeholder="Search nodes by name…" autocomplete="off" />
  </div>

  <div class="header-actions">
    <div class="status-dot loading" id="status-dot"></div>
    <span id="status-text" style="font-size:.8rem;color:var(--text-muted)">Connecting…</span>
    <button class="btn btn-outline" onclick="loadGraph()">↺ Refresh</button>
    <button class="btn btn-primary" onclick="fitGraph()">⤢ Fit Graph</button>
  </div>
</header>

<!-- ===== Sidebar ===== -->
<aside id="sidebar">
  <div class="sidebar-tabs">
    <button class="tab-btn active" data-tab="findings" onclick="switchTab('findings', this)">Findings</button>
    <button class="tab-btn" data-tab="paths"    onclick="switchTab('paths',    this)">Paths</button>
    <button class="tab-btn" data-tab="info"     onclick="switchTab('info',     this)">Node Info</button>
  </div>

  <!-- Findings tab -->
  <div class="tab-content active" id="tab-findings">
    <div class="findings-list" id="findings-list">
      <div class="empty-state">Loading findings…</div>
    </div>
  </div>

  <!-- Paths tab -->
  <div class="tab-content" id="tab-paths">
    <div class="path-form">
      <div>
        <label for="path-from">From (node name)</label>
        <input id="path-from" type="text" placeholder="e.g. jdoe" />
      </div>
      <div>
        <label for="path-to">To (node name)</label>
        <input id="path-to" type="text" placeholder="e.g. Domain Admins" />
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="findPath()">Find Shortest Path</button>
    </div>
    <div class="path-results" id="path-results">
      <div class="empty-state">Enter start and end nodes above to find attack paths.</div>
    </div>
  </div>

  <!-- Node info tab -->
  <div class="tab-content" id="tab-info">
    <div class="node-detail" id="node-detail">
      <div class="empty-state">Click a node in the graph to view details.</div>
    </div>
  </div>
</aside>

<!-- ===== Graph ===== -->
<main id="graph-area">
  <div id="loading-overlay">
    <div class="spinner"></div>
    <span class="loading-text">Loading AD graph…</span>
  </div>

  <div id="network-canvas"></div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-title">Node Types</div>
    <div class="legend-row"><div class="legend-dot" style="background:#3182ce"></div>User</div>
    <div class="legend-row"><div class="legend-dot" style="background:#805ad5"></div>Group</div>
    <div class="legend-row"><div class="legend-dot" style="background:#2f855a"></div>Computer</div>
    <div class="legend-row"><div class="legend-dot" style="background:#718096"></div>OU</div>
    <div class="legend-title" style="margin-top:10px">Risk Tags</div>
    <div class="legend-row"><div class="legend-dot" style="background:#e53e3e"></div>High-Value Target</div>
    <div class="legend-row"><div class="legend-dot" style="background:#dd6b20"></div>Roastable Account</div>
    <div class="legend-row"><div class="legend-dot" style="background:#d69e2e"></div>Delegation Risk</div>
  </div>

  <!-- Stats bar -->
  <div id="stats-bar">
    <div class="stat-item">
      <div class="stat-dot" style="background:#3182ce"></div>
      <span id="stat-nodes">0 nodes</span>
    </div>
    <div class="stat-item">
      <div class="stat-dot" style="background:#484f58"></div>
      <span id="stat-edges">0 edges</span>
    </div>
    <div class="stat-item">
      <div class="stat-dot" style="background:#e53e3e"></div>
      <span id="stat-hv">0 high-value</span>
    </div>
    <div class="stat-item">
      <div class="stat-dot" style="background:#dd6b20"></div>
      <span id="stat-risky">0 risky accounts</span>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
// ============================================================
// State
// ============================================================
let network = null;
let allNodes = [];
let allEdges = [];
const API = '';   // same origin

// ============================================================
// Graph loading
// ============================================================
async function loadGraph() {
  setStatus('loading', 'Loading graph…');
  showOverlay(true);

  try {
    const res  = await fetch(`${API}/api/graph`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    allNodes = data.nodes || [];
    allEdges = data.edges || [];

    renderGraph(allNodes, allEdges);
    updateStats(allNodes, allEdges);
    setStatus('ok', `${allNodes.length} nodes loaded`);
    loadFindings();
  } catch (err) {
    setStatus('error', 'Neo4j unreachable');
    showToast(`⚠ Could not load graph: ${err.message}`, 'error');
    console.error(err);
  } finally {
    showOverlay(false);
  }
}

function renderGraph(nodes, edges) {
  const container = document.getElementById('network-canvas');

  const visNodes = new vis.DataSet(nodes.map(n => ({
    id:    n.id,
    label: n.label,
    title: n.title,
    color: {
      background: n.color,
      border:     lighten(n.color),
      highlight:  { background: n.color, border: '#fff' },
      hover:      { background: lighten(n.color), border: '#fff' },
    },
    font:  { color: '#e6edf3', size: 12, face: 'Inter' },
    shape: nodeShape(n.group),
    size:  20,
    borderWidth: 2,
    shadow: { enabled: true, size: 8, color: n.color + '50' },
  })));

  const visEdges = new vis.DataSet(edges.map(e => ({
    from:   e.from,
    to:     e.to,
    label:  e.label,
    arrows: 'to',
    color:  { color: '#484f58', highlight: '#8b949e', hover: '#8b949e' },
    font:   { color: '#8b949e', size: 10, face: 'Inter', background: '#161b22' },
    smooth: { type: 'dynamic' },
  })));

  const options = {
    layout:   { improvedLayout: true },
    physics: {
      enabled: true,
      solver: 'forceAtlas2Based',
      forceAtlas2Based: {
        gravitationalConstant: -50,
        centralGravity: 0.01,
        springLength: 130,
        springConstant: 0.08,
        damping: 0.4,
      },
      stabilization: { iterations: 200 },
    },
    interaction: {
      hover: true,
      tooltipDelay: 150,
      navigationButtons: false,
      keyboard: true,
    },
    edges: { width: 1.5 },
  };

  if (network) { network.destroy(); }
  network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, options);

  network.on('click', params => {
    if (params.nodes.length > 0) {
      const nodeId = params.nodes[0];
      const node   = allNodes.find(n => n.id === nodeId);
      if (node) showNodeDetail(node);
    }
  });

  network.on('stabilized', () => {
    network.setOptions({ physics: { enabled: false } });
  });
}

function nodeShape(group) {
  const shapes = {
    User:     'dot',
    Group:    'diamond',
    Computer: 'square',
    OU:       'triangle',
  };
  return shapes[group] || 'dot';
}

function lighten(hex) {
  if (!hex || hex.length < 7) return '#888';
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const f = (v) => Math.min(255, v + 60).toString(16).padStart(2,'0');
  return `#${f(r)}${f(g)}${f(b)}`;
}

// ============================================================
// Stats bar
// ============================================================
function updateStats(nodes, edges) {
  document.getElementById('stat-nodes').textContent = `${nodes.length} nodes`;
  document.getElementById('stat-edges').textContent = `${edges.length} edges`;
  const hv = nodes.filter(n => n.color === '#e53e3e').length;
  const risky = nodes.filter(n => n.color === '#dd6b20' || n.color === '#d69e2e').length;
  document.getElementById('stat-hv').textContent    = `${hv} high-value`;
  document.getElementById('stat-risky').textContent = `${risky} risky`;
}

// ============================================================
// Findings sidebar
// ============================================================
const FINDING_DEFS = [
  { key: 'kerberoastable',          title: 'Kerberoastable Users',       badge: 'badge-red',    desc: 'Users with SPNs — hashes can be extracted offline.' },
  { key: 'asrep-roastable',         title: 'AS-REP Roastable Users',     badge: 'badge-red',    desc: 'Accounts with pre-auth disabled — no creds required to get a crackable hash.' },
  { key: 'unconstrained-delegation',title: 'Unconstrained Delegation',   badge: 'badge-orange', desc: 'Computers that cache TGTs — compromising them gives DC-level access.' },
  { key: 'dangerous-acls',          title: 'Dangerous ACLs',             badge: 'badge-orange', desc: 'GenericAll/WriteDacl/WriteOwner on high-value objects.' },
  { key: 'high-value-groups',       title: 'High-Value Group Members',   badge: 'badge-blue',   desc: 'Transitive membership in privileged groups.' },
  { key: 'rbcd',                    title: 'RBCD Configured Computers',  badge: 'badge-blue',   desc: 'Resource-Based Constrained Delegation misconfigs.' },
];

async function loadFindings() {
  const list = document.getElementById('findings-list');
  list.innerHTML = '';

  for (const def of FINDING_DEFS) {
    try {
      const res   = await fetch(`${API}/api/findings/${def.key}`);
      const items = res.ok ? await res.json() : [];
      const count = items.length;

      const card = document.createElement('div');
      card.className = 'finding-card';
      card.innerHTML = `
        <div class="finding-header">
          <span class="finding-name">${def.title}</span>
          <span class="badge ${def.badge}">${count}</span>
        </div>
        <div class="finding-desc">${def.desc}</div>
      `;
      card.onclick = () => showFindingDetail(def.title, items);
      list.appendChild(card);
    } catch {
      /* skip on error */
    }
  }
}

function showFindingDetail(title, items) {
  const detail = document.getElementById('node-detail');
  detail.innerHTML = `<h3>${title}</h3>`;
  if (!items.length) {
    detail.innerHTML += '<div class="empty-state">No findings.</div>';
  } else {
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'path-item';
      row.innerHTML = Object.entries(item)
        .map(([k, v]) => `<div><span style="color:var(--text-muted);font-size:.75rem">${k}: </span><span style="color:var(--text-code);font-family:var(--mono);font-size:.78rem">${JSON.stringify(v)}</span></div>`)
        .join('');
      detail.appendChild(row);
    });
  }
  switchTab('info', document.querySelector('[data-tab="info"]'));
}

// ============================================================
// Node detail
// ============================================================
function showNodeDetail(node) {
  const detail = document.getElementById('node-detail');
  const fields = [
    ['Name',     node.label],
    ['Type',     node.group],
    ['ID',       node.id],
  ];

  // Parse extra props from tooltip HTML
  const titleText = (node.title || '').replace(/<[^>]+>/g, ' ').trim();

  detail.innerHTML = `
    <h3 style="word-break:break-all">${node.label}</h3>
    ${fields.map(([k, v]) => `
      <div class="detail-row">
        <span class="detail-key">${k}</span>
        <span class="detail-value">${v ?? '—'}</span>
      </div>`).join('')}
    <div style="margin-top:12px;padding:10px;background:var(--bg-card);border-radius:var(--radius);font-size:.78rem;color:var(--text-muted);line-height:1.6">${titleText}</div>
  `;
  switchTab('info', document.querySelector('[data-tab="info"]'));

  // Highlight node in graph
  if (network) {
    network.selectNodes([node.id]);
    network.focus(node.id, { animation: { duration: 500, easingFunction: 'easeInOutQuad' }, scale: 1.5 });
  }
}

// ============================================================
// Path finding
// ============================================================
async function findPath() {
  const from = document.getElementById('path-from').value.trim();
  const to   = document.getElementById('path-to').value.trim();
  if (!from || !to) { showToast('Enter both From and To nodes'); return; }

  const results = document.getElementById('path-results');
  results.innerHTML = '<div class="empty-state">Searching…</div>';

  try {
    const res   = await fetch(`${API}/api/paths/shortest?start=${encodeURIComponent(from)}&end=${encodeURIComponent(to)}`);
    const paths = res.ok ? await res.json() : [];

    if (!paths.length) {
      results.innerHTML = '<div class="empty-state">No path found between these nodes.</div>';
      return;
    }

    results.innerHTML = '';
    paths.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'path-item';
      item.innerHTML = `
        <div class="path-hops">Path ${i + 1}  —  ${p.hops ?? '?'} hop(s)</div>
        <div class="path-nodes">${(p.path || []).join(' → ')}</div>
        ${p.rels ? `<div class="path-rels">via: ${p.rels.join(' → ')}</div>` : ''}
      `;
      results.appendChild(item);
    });
  } catch (err) {
    results.innerHTML = `<div class="empty-state">Error: ${err.message}</div>`;
  }
}

// ============================================================
// Search
// ============================================================
document.getElementById('node-search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  if (!network || !allNodes.length) return;

  if (!q) {
    // Reset all nodes
    network.body.data.nodes.update(
      allNodes.map(n => ({ id: n.id, opacity: 1 }))
    );
    return;
  }

  const matches = allNodes.filter(n => (n.label || '').toLowerCase().includes(q));
  const matchIds = new Set(matches.map(n => n.id));

  network.body.data.nodes.update(
    allNodes.map(n => ({ id: n.id, opacity: matchIds.has(n.id) ? 1 : 0.1 }))
  );

  if (matches.length === 1 && network) {
    network.focus(matches[0].id, { animation: true, scale: 1.8 });
  }
});

document.getElementById('node-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = e.target.value.toLowerCase().trim();
    const match = allNodes.find(n => (n.label || '').toLowerCase() === q);
    if (match) showNodeDetail(match);
  }
});

// ============================================================
// Tab switching
// ============================================================
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tabId}`).classList.add('active');
  if (btn) btn.classList.add('active');
}

// ============================================================
// Utilities
// ============================================================
function fitGraph() {
  if (network) network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
}

function showOverlay(show) {
  const ov = document.getElementById('loading-overlay');
  if (show) { ov.classList.remove('hidden'); } else { ov.classList.add('hidden'); }
}

function setStatus(state, text) {
  const dot  = document.getElementById('status-dot');
  const span = document.getElementById('status-text');
  dot.className  = `status-dot ${state === 'ok' ? '' : state}`;
  span.textContent = text;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show';
  setTimeout(() => { t.className = ''; }, 4000);
}

// ============================================================
// Boot
// ============================================================
document.addEventListener('DOMContentLoaded', loadGraph);
</script>
</body>
</html>
