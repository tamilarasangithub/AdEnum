[project]
name        = "adenum"
version     = "0.2.0"
description = "Active Directory Attack Path Analytics and Vulnerability Mapper"
readme      = "README.md"
requires-python = ">=3.10"

dependencies = [
    "ldap3>=2.9.1",
    "impacket>=0.11.0",
    "neo4j>=5.19.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "black>=24.3.0",
    "ruff>=0.3.4",
]

[project.scripts]
adenum = "adenum.cli:cli"

[build-system]
requires      = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adenum*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length    = 100
target-version = ["py310", "py311"]
